                                { title: 'Pengenalan Lingkungan Sekolah', desc: 'Setelah terbitnya pengumuman SPMB, inilah saatnya OSIS mengenalkan lingkungan sekolah kepada peserta didik baru. PLS atau Pengenalan Lingkungan Sekolah adalah program kerja Osis yang memiliki tujuan membantu proses adaptasi adik-adik yang baru masuk di SMAN 2 Purwokerto untuk terbiasa dengan lingkungan sekitarnya. Bentuk dari acara PLS ini beragam lho, yakni adanya sosialisasi dari kepala sekolah, sosialisasi dari pihak luar/eksternal, demo organisasi dan ekskul, serta pemberian tugas kepada peserta didik baru. Setelah diadakannya PLS, biasanya kegiatan dilanjutkan dengan Kemah Penerimaan Dewan Calon Ambalan, yaitu salah 1 program kerja Garuda Shima.' },
                                { title: 'Anjangsana/i', desc: 'Anjangsana/i adalah kegiatan berkunjung/dikunjungi OSIS sekolah lain untuk saling bertukar ilmu dan pengalaman. Dalam anjangsana/i, bentuk kegiatannya sangat menarik lho, ada pemaparan materi mengenai organisasi masing-masing sekolah, games dan ice breaking, tea and coffee time, sharing-sharing jabatan, dan school tour. Kegiatan ini sangat asik karena bisa menambah networking dan juga ajang menggali informasi dan menumbuhkan jiwa inovatif dalam diri setiap anggota.' },
                                { title: 'Gelar Kreasi Siswa (GKS)', desc: 'Gelar Kreasi Siswa adalah ajang perlombaan dimana seluruh siswa SMAN 2 Purwokerto dapat menampilkan bakat dan minatnya. Kegiatan ini biasanya dibarengi/collab dengan program kurikulum, yakni P5.' }
