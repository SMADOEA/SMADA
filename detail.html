<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Organisasi - SMAN 2 Purwokerto</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        smadaBlue: '#0284C7',
                        smadaLightBlue: '#38BDF8',
                        smadaBg: '#F8FAFC',
                        smadaCard: '#FFFFFF',
                        smadaBorder: '#E2E8F0',
                        smadaText: '#0F172A',
                        smadaMuted: '#64748B'
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Alpine Collapse Plugin untuk Animasi Laci -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-smadaBg text-smadaText font-sans antialiased selection:bg-smadaBlue selection:text-white" x-data="orgDetail()">

    <!-- Navbar -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-smadaBorder shadow-sm">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2 text-smadaBlue font-semibold hover:underline">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                <span>Kembali ke Beranda</span>
            </a>
            <span class="text-xs font-bold uppercase tracking-wider text-smadaMuted" x-text="data.badge"></span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12" x-data="{ openSection: 'kepengurusan' }">
        
        <!-- Header Profil -->
        <div class="bg-smadaCard border border-smadaBorder rounded-3xl p-8 sm:p-10 shadow-sm text-center mb-8">
            <div class="w-20 h-20 mx-auto mb-5 rounded-2xl bg-sky-50 border border-sky-100 flex items-center justify-center text-smadaBlue font-extrabold text-2xl shadow-inner">
                <span x-text="data.name ? data.name.charAt(0) : 'S'"></span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-smadaText mb-3" x-text="data.name"></h1>
            <p class="text-smadaMuted text-sm sm:text-base leading-relaxed max-w-xl mx-auto" x-text="data.desc"></p>
        </div>

        <!-- Daftar Laci (Accordion) -->
        <div class="space-y-4">
            
            <!-- Laci 1: Kepengurusan -->
            <div class="bg-smadaCard border border-smadaBorder rounded-2xl overflow-hidden shadow-sm transition-all">
                <button @click="openSection = (openSection === 'kepengurusan' ? null : 'kepengurusan')" 
                        class="w-full px-6 py-4 flex items-center justify-between text-left font-bold text-smadaText hover:bg-sky-50/50 transition">
                    <span class="flex items-center text-sm sm:text-base">
                        <span class="w-2 h-5 bg-smadaBlue rounded-full mr-3"></span>
                        KEPENGURUSAN
                    </span>
                    <svg class="w-5 h-5 text-smadaMuted transition-transform duration-300" :class="openSection === 'kepengurusan' ? 'rotate-180 text-smadaBlue' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div x-show="openSection === 'kepengurusan'" x-collapse class="px-6 pb-6 pt-2 border-t border-smadaBorder">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-2">
                        <template x-for="(group, title) in data.kepengurusan">
                            <div class="bg-slate-50 border border-smadaBorder rounded-xl p-4">
                                <h3 class="font-bold text-smadaBlue text-xs uppercase tracking-wide mb-2" x-text="title"></h3>
                                <ul class="space-y-1.5">
                                    <template x-for="item in group">
                                        <li class="text-xs sm:text-sm text-smadaText flex items-center justify-between py-1 border-b border-slate-200/60 last:border-0">
                                            <span x-text="item.role" class="font-medium"></span>
                                            <span x-text="item.name" class="text-smadaMuted font-mono text-xs"></span>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Laci 2: Program Kerja -->
            <div class="bg-smadaCard border border-smadaBorder rounded-2xl overflow-hidden shadow-sm transition-all">
                <button @click="openSection = (openSection === 'progja' ? null : 'progja')" 
                        class="w-full px-6 py-4 flex items-center justify-between text-left font-bold text-smadaText hover:bg-sky-50/50 transition">
                    <span class="flex items-center text-sm sm:text-base">
                        <span class="w-2 h-5 bg-smadaBlue rounded-full mr-3"></span>
                        PROGRAM KERJA UTAMA
                    </span>
                    <svg class="w-5 h-5 text-smadaMuted transition-transform duration-300" :class="openSection === 'progja' ? 'rotate-180 text-smadaBlue' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div x-show="openSection === 'progja'" x-collapse class="px-6 pb-6 pt-2 border-t border-smadaBorder">
                    <div class="space-y-4 mt-2">
                        <template x-for="(prog, index) in data.progjaDetails">
                            <div class="bg-slate-50 border border-smadaBorder rounded-xl p-4">
                                <h3 class="text-sm sm:text-base font-bold text-smadaText mb-1" x-text="(index + 1) + '. ' + prog.title"></h3>
                                <p class="text-xs sm:text-sm text-smadaMuted leading-relaxed" x-text="prog.desc"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Laci 3: Lain-lain -->
            <div class="bg-smadaCard border border-smadaBorder rounded-2xl overflow-hidden shadow-sm transition-all" x-show="data.lainLain">
                <button @click="openSection = (openSection === 'lain' ? null : 'lain')" 
                        class="w-full px-6 py-4 flex items-center justify-between text-left font-bold text-smadaText hover:bg-sky-50/50 transition">
                    <span class="flex items-center text-sm sm:text-base">
                        <span class="w-2 h-5 bg-smadaBlue rounded-full mr-3"></span>
                        LAIN-LAIN
                    </span>
                    <svg class="w-5 h-5 text-smadaMuted transition-transform duration-300" :class="openSection === 'lain' ? 'rotate-180 text-smadaBlue' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div x-show="openSection === 'lain'" x-collapse class="px-6 pb-6 pt-2 border-t border-smadaBorder">
                    <ul class="space-y-2 mt-2">
                        <template x-for="note in data.lainLain">
                            <li class="flex items-start text-xs sm:text-sm text-smadaMuted bg-slate-50 border border-smadaBorder rounded-xl p-3">
                                <span class="text-smadaBlue mr-2 font-bold">•</span>
                                <span x-text="note"></span>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>

            <!-- Laci 4: Sosial Media -->
            <div class="bg-smadaCard border border-smadaBorder rounded-2xl overflow-hidden shadow-sm transition-all">
                <button @click="openSection = (openSection === 'sosmed' ? null : 'sosmed')" 
                        class="w-full px-6 py-4 flex items-center justify-between text-left font-bold text-smadaText hover:bg-sky-50/50 transition">
                    <span class="flex items-center text-sm sm:text-base">
                        <span class="w-2 h-5 bg-smadaBlue rounded-full mr-3"></span>
                        SOSIAL MEDIA
                    </span>
                    <svg class="w-5 h-5 text-smadaMuted transition-transform duration-300" :class="openSection === 'sosmed' ? 'rotate-180 text-smadaBlue' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div x-show="openSection === 'sosmed'" x-collapse class="px-6 pb-6 pt-2 border-t border-smadaBorder">
                    <div class="flex gap-3 mt-3">
                        <a href="#" class="flex-1 py-2.5 rounded-xl bg-sky-50 text-smadaBlue text-xs sm:text-sm font-semibold border border-sky-100 hover:bg-smadaBlue hover:text-white transition text-center">Instagram</a>
                        <a href="#" class="flex-1 py-2.5 rounded-xl bg-sky-50 text-smadaBlue text-xs sm:text-sm font-semibold border border-sky-100 hover:bg-smadaBlue hover:text-white transition text-center">TikTok</a>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-smadaBorder py-12 text-center text-sm text-smadaMuted bg-white mt-20">
        <p>© 2026 SMAN 2 Purwokerto. Portal Resmi Organisasi & Ekstrakurikuler.</p>
    </footer>

    <!-- Script Pengisi Data Dinamis -->
    <script>
        function orgDetail() {
            return {
                data: {},
                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug') || 'osis';
                    
                    const database = {
                        'osis': {
                            name: 'OSIS SMAN 2 Purwokerto (Fatyakarsa)',
                            badge: 'Organisasi Utama',
                            desc: 'Organisasi Siswa Intra Sekolah (OSIS) SMAN 2 Purwokerto merupakan organisasi utama yang menaungi seluruh kegiatan kesiswaan, penertiban, kebersihan lingkungan, serta event besar sekolah.',
                            kepengurusan: {
                                'BPH (Badan Pengurus Harian)': [
                                    { role: 'Ketua Umum', name: '(001)' },
                                    { role: 'Sekretaris Umum', name: '(004)' },
                                    { role: 'Bendahara Umum', name: '(007)' }
                                ],
                                'Seksi Bidang Utama': [
                                    { role: 'KTTYME (Keagamaan)', name: 'Koordinator' },
                                    { role: 'PPBN (Bela Negara)', name: 'Koordinator' },
                                    { role: 'KBPL (Budi Pekerti)', name: 'Koordinator' },
                                    { role: 'OPPK (Politik & Kepemimpinan)', name: 'Koordinator' }
                                ]
                            },
                            progjaDetails: [
                                { title: 'Smada Expo', desc: 'Acara besar tahunan untuk memperingati hari ulang tahun SMAN 2 Purwokerto yang diisi dengan perlombaan internal maupun eksternal seperti pentas seni dan pameran.' },
                                { title: 'Bakti Sosial', desc: 'Program kemanusiaan dan kepedulian sosial ke desa mitra atau panti asuhan melalui penyuluhan, pemeriksaan kesehatan, dan bantuan sosial.' },
                                { title: 'Classmeeting', desc: 'Rangkaian perlombaan antar-kelas yang dilaksanakan rutin untuk menyalurkan bakat olahraga, e-sports, dan kreativitas siswa.' },
                                { title: 'Peringatan HUT RI', desc: 'Perayaan kemerdekaan Republik Indonesia yang diisi upacara, formasi selebrasi, tasyakuran, dan berbagai lomba positif.' }
                            ],
                            lainLain: [
                                'OSIS SMAN 2 Purwokerto terdiri dari Pengurus Inti, Pengurus Umum, dan Pengurus Perwakilan Ekstrakurikuler.',
                                'Nama periode kepengurusan dinamai berurutan berdasarkan abjad (misal: Fatyakarsa).',
                                'Memiliki sistem NPO (Nomor Pengurus OSIS) resmi untuk penataan administrasi.'
                            ]
                        },
                        'default': {
                            name: 'Profil Organisasi & Ekstrakurikuler SMADA',
                            badge: 'Informasi Resmi',
                            desc: 'Wadah resmi pengembangan bakat, minat, kedisiplinan, dan prestasi siswa di lingkungan SMAN 2 Purwokerto.',
                            kepengurusan: {
                                'Pengurus Inti': [
                                    { role: 'Ketua', name: 'Pengurus Aktif' },
                                    { role: 'Sekretaris', name: 'Pengurus Aktif' }
                                ]
                            },
                            progjaDetails: [
                                { title: 'Latihan & Kegiatan Rutin', desc: 'Kegiatan pembinaan rutin yang terjadwal untuk mengasah keterampilan anggota.' },
                                { title: 'Partisipasi Event & Lomba', desc: 'Keikutsertaan aktif dalam berbagai kompetisi tingkat regional maupun nasional.' }
                            ],
                            lainLain: [
                                'Terbuka bagi seluruh siswa SMAN 2 Purwokerto yang memiliki minat dan komitmen.',
                                'Aktif berkontribusi dalam berbagai event besar sekolah.'
                            ]
                        }
                    };

                    this.data = database[slug] || database['default'];
                }
            }
        }
    </script>
</body>
</html>
